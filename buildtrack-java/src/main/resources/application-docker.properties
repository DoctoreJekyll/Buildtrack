spring.application.name=buildtrack

spring.datasource.url=jdbc:postgresql://postgres:5432/buildtrack
spring.datasource.username=${POSTGRES_USER:buildtrack}
spring.datasource.password=${POSTGRES_PASSWORD:buildtrack}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.secret=${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50U2VjcmV0S2V5MTIzNDU2Nzg5MA==}